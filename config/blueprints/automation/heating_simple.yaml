blueprint:
  name: Heating Simple
  description: |
    **simplified heating control**
    **Version** 1.07-b76
    **Repository** [march42/home-assistant-extras](march42/home-assistant-extras/)

    Copyright (C) 2023-2024 Marc Hefter

    This program is free software: you can redistribute it and/or modify
    it under the terms of the GNU General Public License as published by
    the Free Software Foundation, either version 3 of the License, or
    (at your option) any later version.

    This program is distributed in the hope that it will be useful,
    but WITHOUT ANY WARRANTY; without even the implied warranty of
    MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
    GNU General Public License for more details.

    Please see the GNU General Public License at [https://www.gnu.org/licenses/](https://www.gnu.org/licenses/).
  author: march42
  source_url: https://github.com/march42/home-assistant-extras/blob/main/config/blueprints/automation/heating_simple.yaml
  domain: automation

  input:
    valves:
      name: Heating Valves
      description: Thermostats (thermostatic regulated valves) to be controlled with this settings
      selector:
        entity:
          filter:
            - domain:
              - climate
          multiple: true
    scheduler:
      name: Scheduler for comfort temperature
      description: >
        Scheduler to specify times, to activate comfort or away temperature.
        While 'off', eco temperature will be used.
      selector:
        entity:
          filter:
            - domain:
              - schedule
          multiple: false
    min_temp:
      name: Minimum Temperature
      description: >
        Temperature, to use as minimum.
        This is used as a default value, if Eco Temperature not specified.
      default: 12
      selector:
        number:
          min: 5.0
          max: 25.0
          step: 0.5
          mode: slider
          unit_of_measurement: °C
    eco_temp:
      name: (optional) Eco Temperature
      description: Temperature, to use if scheduler is off, e.g. during night periods.
      selector:
        entity:
          filter:
            - domain:
              - input_number
          multiple: false
      default:
    day_temp:
      name: Day Temperature
      description: >
        Temperature, to use for active heating.
        This is used as a default value, if Comfort Temperature not specified.
      default: 18
      selector:
        number:
          min: 5.0
          max: 25.0
          step: 0.5
          mode: slider
          unit_of_measurement: °C
    comfort_temp:
      name: (optional) Comfort Temperature
      description: Temperature, to use if scheduler in on and someone is at home.
      selector:
        entity:
          filter:
            - domain:
              - input_number
          multiple: false
      default:
    event_delay:
      name: Delay Event
      description: >
        Time in seconds changes needs to be active, before acting.
        This will delay the triggered event and filter glitches.
      default: 2
      selector:
        number:
          min: 0
          max: 9
          step: 1
          mode: slider
          unit_of_measurement: seconds
    manually_revert_delay:
      name: Delay Revert from manually setting Radiator
      description: >
        Time in minutes before reverting to schedule after manually setting radiator valve.
        Set to 0, to ignore manually changed temperature.
      default: 90
      selector:
        number:
          min: 0
          max: 300
          step: 1
          mode: slider
          unit_of_measurement: minutes
    action_delay:
      name: Delay Actions
      description: >
        Time in seconds delaying between subsequent actions.
        To ensure the components are ready again.
      default: 2
      selector:
        number:
          min: 0
          max: 9
          step: 1
          mode: slider
          unit_of_measurement: seconds
    winter_mode:
      name: (optional) Winter mode
      description: >
        If used, this needs to be 'on', for heating to be enabled.
        If this entity is 'off', the heating will be disabled.
      default:
      selector:
        entity:
          filter:
            - domain:
              - input_boolean
              - binary_sensor
          multiple: false
    override_max:
      name: (optional) Override valves to max
      description: Activate all valves, to maximum temperature.
      default:
      selector:
        entity:
          filter:
            - domain:
              - input_boolean
              - timer
          multiple: true

    window:
      name: (optional) Window sensor
      description: >
        Window opened sensor or group of sensors, to check.
        If 'on' the window is considered opened and the valves will be shut off.
      default:
      selector:
        entity:
          filter:
            - domain:
              - binary_sensor
          multiple: true
    windowopened_delay:
      name: Delay window opened
      description: >
        Time in minutes window needs to be opened, before acting.
      default: 3
      selector:
        number:
          min: 0
          max: 9
          step: 1
          mode: slider
          unit_of_measurement: minutes

    persons:
      name: (optional) Persons for presence detection
      description: >
        Persons to check present for activating comfort temperature.
        If none of the persons are detected home, the away temperature will be used instead of confort temperature.
        Instead of persons, you can use 'device_tracker' as well.
        If undefined, the script will always set persons_home=1.
      default:
      selector:
        entity:
          filter:
            - domain:
              - person
              - device_tracker
              - input_boolean
          multiple: true
    away_temp:
      name: (optional) Away Temperature
      description: >
        Temperature, to use if no one is at home.
        If unset, eco temperature will be used.
      default:
      selector:
        entity:
          filter:
            - domain:
              - input_number
          multiple: false
    nobodyhome_delay:
      name: Delay nobody home
      description: >
        Time in minutes before acting on no persons at home.
      default: 3
      selector:
        number:
          min: 0
          max: 99
          step: 1
          mode: slider
          unit_of_measurement: minutes

    party_mode:
      name: (optional) Party ongoing (timer or boolean)
      description: >
        If active, heating will be activated.
        During party the scheduler, presence and window open detection will be ignored.
      default:
      selector:
        entity:
          filter:
            - domain:
              - timer
              - input_boolean
          multiple: true
    party_temp:
      name: (optional) Party Temperature
      description: >
        Temperature, to use if party is happening.
        If unset, comfort temperature will be used instead.
      default:
      selector:
        entity:
          filter:
            - domain:
              - input_number
          multiple: false

variables:
  # get the settings to variables
  valves: !input valves
  min_temp: !input min_temp
  eco_temp: > # the eco/low temp during heating periods
    {% if eco_temp_input is not none %}
      {{ states(eco_temp_input) | float }}
    {% else %}
      {{ min_temp }}
    {% endif %}
  manually_revert_delay: !input manually_revert_delay
  # interpret settings to state variables
  day_temp: !input day_temp
  comfort_temp: >
    {% if comfort_temp_input is not none %}
      {{ states(comfort_temp_input) | float }}
    {% else %}
      {{ day_temp }}
    {% endif %}
  away_temp: >
    {% if away_temp_input is not none %}
      {{ states(away_temp_input) | float }}
    {% else %}
      {{ eco_temp }}
    {% endif %}
  party_temp: >
    {% if party_temp_input is not none %}
      {{ states(party_temp_input) | float }}
    {% else %}
      {{ comfort_temp }}
    {% endif %}
  windows_opened: >
    {% if window is not none %}
      {{ expand(window) | selectattr('state', 'eq', 'on') | list | count }}
    {% else %}
      0
    {% endif %}
  persons_home: >
    {% if persons is not none %}
      {{ expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count }}
    {% else %}
      -1
    {% endif %}
  # some checking variables for simplification
  is_party: > # party started
    {{ party_mode is not none and expand(party_mode) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}
  is_comfort: > # scheduler unset or active
    {{ scheduler is none or expand(scheduler) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}
  is_override_max: > # override to max set and active
    {{ override_max is not none
      and ( expand(override_max) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 ) }}
  is_winter: > # winter_mode unset or any is on
    {{ winter_mode is none or expand(winter_mode) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}
  is_summer: > # winter_mode set and none is on
    {{ winter_mode is not none and expand(winter_mode) | selectattr('state', 'in', ['on', 'active']) | list | count == 0 }}
  scheduled_preset: >
    {% if is_party %}
      party
    {% else %}
      {% if is_comfort %}
        {% if persons_home == 0 %}
          away
        {% else %}
          comfort
        {% endif %}
      {% else %}
        eco
      {% endif %}
    {% endif %}
  scheduled_temp: >
    {% if is_party %}
      {{ party_temp }}
    {% else %}
      {% if is_comfort %}
        {% if persons_home == 0 %}
          {{ away_temp }}
        {% else %}
          {{ comfort_temp }}
        {% endif %}
      {% else %}
        {{ eco_temp }}
      {% endif %}
    {% endif %}
  is_temp_changed: > # trigger, on temperature changed
    {{ trigger is not none and trigger.id == 'TRV_temp_changed' }}
  is_temp_manual: > # trigger, on temperature changed manually
    {{ is_temp_changed and not is_override_max and windows_opened == 0
      and trigger.to_state.attributes.temperature != scheduled_temp }}
  is_scheduler_start: "{{ trigger is not none and trigger.id == 'scheduler_start' }}"
  is_manual_event: "{{ trigger is not none and trigger.id == 'manual_event' }}"
  manual_event: >
    {% if trigger is not none and trigger.id == 'manual_event' and trigger.event.event_type is not none %}
      {{ trigger.event.event_type }}
    {% else %}
      none
    {% endif %}
  valves_master: > # triggering valve or first, if no trigger
    {% if trigger is not none and trigger.id == 'TRV_temp_changed' %}
      {{ trigger.entity_id }}
    {% else %}
      {{ valves | first }}
    {% endif %}

trigger_variables:
  scheduler: !input scheduler
  eco_temp_input: !input eco_temp
  comfort_temp_input: !input comfort_temp
  window: !input window
  override_max: !input override_max
  winter_mode: !input winter_mode
  persons: !input persons
  away_temp_input: !input away_temp
  party_mode: !input party_mode
  party_temp_input: !input party_temp

trigger:
  # platform events
  - id: "homeassistant_start"
    platform: homeassistant
    event: start
  - id: "homeassistant_shutdown"
    platform: homeassistant
    event: shutdown
  - id: "manual_event"
    platform: event
    event_type:
      - "HEATING_RESET_TO_SCHEDULER"
      - "HEATING_SET_ECO"
      #- "{{ 'HEATING_' ~ sub_event }}"

  - id: 'TRV_temp_changed'
    platform: state # temperature setting changed
    entity_id: !input valves
    attribute: temperature
    alias: 'temperature changed on TRV'
    #not_to: {{ scheduled_temp }} # unluckily this is not working
    for:
      minutes: !input manually_revert_delay
      seconds: 13 # delay always, to ensure manually handling is done

  - id: "scheduler_start"
    platform: template # scheduler switching to on
    value_template: >
      {{ scheduler is not none and is_state(scheduler, 'on') }}
    alias: 'scheduler switching to on'
    for:
      seconds: !input event_delay
  - id: "scheduler_end"
    platform: template # scheduler switching to off
    value_template: >
      {{ scheduler is not none and is_state(scheduler, 'off') }}
    alias: 'scheduler switching to off'
    for:
      seconds: !input event_delay
  - id: "winter_start"
    platform: template # winter mode switching to on
    value_template: >
      {{ winter_mode is not none and is_state(winter_mode, 'on') }}
    alias: 'winter mode switching to on'
    for:
      seconds: !input event_delay
  - id: "winter_end"
    platform: template # winter mode switching to off
    value_template: >
      {{ winter_mode is not none and is_state(winter_mode, 'off') }}
    alias: 'winter mode switching to off'
    for:
      seconds: !input event_delay
  - id: "override_start"
    platform: template # override mode switching to on
    value_template: >
      {{ override_max is not none
        and ( expand(override_max) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 ) }}
    alias: 'override switching to on'
    for:
      seconds: !input event_delay
  - id: "override_end"
    platform: template # override mode switching to off
    value_template: >
      {{ override_max is not none
        and ( expand(override_max) | selectattr('state', 'in', ['on', 'active']) | list | count == 0 ) }}
    alias: 'override switching to off'
    for:
      seconds: !input event_delay
  - id: "window_closed"
    platform: template # windows closed (opened == 0)
    value_template: >
      {{ window is not none and
      ( expand(window) | selectattr('state', 'eq', 'on') | list | count == 0 ) }}
    alias: 'windows closed'
    for:
      #minutes: !input windowopened_delay # don't use on closing windows
      seconds: !input event_delay
  - id: "window_opened"
    platform: template # windows opened > 0
    value_template: >
      {{ window is not none and
      ( expand(window) | selectattr('state', 'eq', 'on') | list | count > 0 ) }}
    alias: 'window opened'
    for:
      minutes: !input windowopened_delay
  - id: "nobody_home"
    platform: template # nobody home
    value_template: >
      {{ persons is not none and expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count == 0 }}
    alias: 'nobody home'
    for:
      minutes: !input nobodyhome_delay
  - id: "somebody_home"
    platform: template # somebody home
    value_template: >
      {{ persons is not none and expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count != 0 }}
    alias: 'someone came home'
    for:
      #minutes: !input nobodyhome_delay # don't use on getting home
      seconds: !input event_delay
  - id: "party_start"
    platform: template # party mode switching to on
    value_template: >
      {{ party_mode is not none and ( expand(party_mode) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 ) }}
    alias: 'party mode switching to on'
    for:
      seconds: !input event_delay
  - id: "party_end"
    platform: template # party mode switching to off
    value_template: >
      {{ party_mode is not none and ( expand(party_mode) | selectattr('state', 'in', ['on', 'active']) | list | count == 0 ) }}
    alias: 'party mode switching to off'
    for:
      seconds: !input event_delay

mode: parallel # run in parallel
max: 3 # no more than 3 running at once
max_exceeded: warning

action:

  - choose: # take actions for specific events
    - conditions: # home assistant shutting down
        #- "{{ trigger is not none and trigger.id == 'homeassistant_shutdown' }}"
        - condition: trigger
          id: 'homeassistant_shutdown'
      sequence:
        - event: HEATING_SET_ECO
          event_data:
            reason: homeassistant_shutdown
        - stop: "for now, nothing more to do; more will be triggered"
    - conditions: # manually set ECO temp
        - "{{ is_manual_event and manual_event == 'HEATING_SET_ECO' }}"
      sequence:
        - variables:
            active_helpers: > # list of active helpers, to turn off
              {% if override_max is not none and party_mode is not none %}
                {{ expand(override_max,party_mode) | selectattr('state', 'in', ['on', 'active']) | map(attribute='entity_id') | unique | list }}
              {% else %}
                {% if override_max is not none %}
                  {{ expand(override_max) | selectattr('state', 'in', ['on', 'active']) | map(attribute='entity_id') | unique | list }}
                {% endif %}
                {% if party_mode is not none %}
                  {{ expand(party_mode) | selectattr('state', 'in', ['on', 'active']) | map(attribute='entity_id') | unique | list }}
                {% endif %}
              {% endif %}
        - if:
            - "{{ expand(active_helpers) | list | count > 0 }}"
          then:
            - if: # timer state==active
                - "{{ expand(active_helpers) | selectattr('state', 'eq', 'active') | list | count > 0 }}"
              then:
                - service: timer.cancel
                  data: {}
                  target:
                    entity_id: "{{ expand(active_helpers) | map(attribute='entity_id') | list }}"
            - if: # binary,switch state=on
                - "{{ expand(active_helpers) | selectattr('state', 'eq', 'on') | list | count > 0 }}"
              then:
                - service: homeassistant.turn_off
                  data: {}
                  target:
                    entity_id: "{{ expand(active_helpers) | selectattr('state', 'eq', 'on') | map(attribute='entity_id') | list }}"
            - delay: "00:00:05" # give 5 seconds, for scripts to be triggered
            - wait_for_trigger: # wait for temperature setting to be changed
              - platform: state
                entity_id: !input valves
                attribute: "temperature"
                for: 2
              timeout: "00:00:13.0"
              continue_on_timeout: true
        # just set temperature - but don't activate, if turned off
        - if:
            - "{{ is_winter }}"
          then:
            - service: climate.set_temperature
              target:
                entity_id: !input valves
              data:
                temperature: "{{ eco_temp }}"
          else:
            - service: climate.set_hvac_mode
              target:
                entity_id: !input valves
              data:
                hvac_mode: "off"
        - stop: "stopped helpers and set to eco_temp"
    - conditions: # temperature on TRV changed
        - condition: trigger
          id: 'TRV_temp_changed'
      sequence:
        - if: # ignore valid changes
            - condition: template
              value_template: > # temp changed trigger
                {{ is_temp_manual and manually_revert_delay > 0 }}
          then:
            - service: system_log.write
              data:
                message: >
                  revert from manually changed temperature,
                  changed to {{ trigger.to_state.attributes.temperature }} from {{ trigger.from_state.attributes.temperature }} 
                level: warning
                logger: blueprints.march42.climate
          else:
            - stop: "ignore changed temperature, not manually or manually_revert_delay == 0"
    default:
      - service: system_log.write
        data:
          message: >
            Heating Control by march42
            triggered with {{ trigger }}
            valves {{ valves }}
            scheduled {{ scheduled_preset }}, {{ scheduled_temp }}
          level: info
          logger: blueprints.march42.climate

  # set TRVs to scheduled values
  - choose:
    - conditions: # override
        - "{{ is_override_max }}"
      sequence:
        - service: climate.set_hvac_mode
          target:
            entity_id: !input valves
          data:
            hvac_mode: 'heat'
        - delay:
            seconds: !input action_delay
        - service: climate.set_temperature
          target:
            entity_id: !input valves
          data:
            temperature: 30
    - conditions: # summer or window opened
        - "{{ is_summer or (windows_opened > 0) }}"
      sequence:
        - service: climate.set_hvac_mode
          target:
            entity_id: !input valves
          data:
            hvac_mode: 'off'
    default: # scheduled condition
      - service: climate.set_hvac_mode
        target:
          entity_id: !input valves
        data:
          hvac_mode: 'heat'
      - delay:
          seconds: !input action_delay
      - variables:
          current_temp: "{{ state_attr(valves_master,'current_temperature') | float }}"
      - if: # current temperature at least 3° lower
          - condition: template
            value_template: "{{ (is_scheduler_start or is_manual_event) and (current_temp | float) + 3.0 <= (scheduled_temp | float) }}"
        then: # boost heating, to warm up
          - service: climate.set_temperature
            target:
              entity_id: !input valves
            data:
              temperature: "{{ (scheduled_temp | float) + 3.0 }}"
          - wait_for_trigger:
              - platform: numeric_state
                entity_id: !input valves
                value_template: "{{ state.attributes.current_temperature - state.attributes.temperature_set_point }}"
                above: 1.0
            timeout:
              minutes: 15
            continue_on_timeout: true
      # set desired heating set point
      - service: climate.set_temperature
        target:
          entity_id: !input valves
        data:
          temperature: "{{ scheduled_temp | float }}"
