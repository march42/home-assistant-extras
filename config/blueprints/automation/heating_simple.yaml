blueprint:
  name: Heating Simple
  description: |
    **simplified heating control**
    **Version** 1.05-b66
    **Repository** [march42/home-assistant-extras](march42/home-assistant-extras/)

    Copyright (C) 2023 Marc Hefter

    This program is free software: you can redistribute it and/or modify
    it under the terms of the GNU General Public License as published by
    the Free Software Foundation, either version 3 of the License, or
    (at your option) any later version.

    This program is distributed in the hope that it will be useful,
    but WITHOUT ANY WARRANTY; without even the implied warranty of
    MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
    GNU General Public License for more details.

    Please see the GNU General Public License at [https://www.gnu.org/licenses/](https://www.gnu.org/licenses/).
  author: march42
  source_url: https://github.com/march42/home-assistant-extras/blob/main/config/blueprints/automation/heating_simple.yaml
  domain: automation

  input:
    valves:
      name: Heating Valves
      description: Thermostats (thermostatic regulated valves) to be controlled with this settings
      selector:
        entity:
          filter:
            - domain:
              - climate
          multiple: true
    scheduler:
      name: Scheduler for comfort temperature
      description: >
        Scheduler to specify times, to activate comfort or away temperature.
        While 'off', eco temperature will be used.
      selector:
        entity:
          filter:
            - domain:
              - schedule
          multiple: false
    eco_temp:
      name: Eco Temperature
      description: >
        Temperature, to use as minimum.
        This will be used, if scheduler is off, e.g. during night periods.
      default: 13
      selector:
        number:
          min: 5.0
          max: 30.0
          step: 0.5
          mode: slider
          unit_of_measurement: °C
    comfort_temp:
      name: Comfort Temperature
      description: Temperature, to use if scheduler in on and someone is at home.
      selector:
        entity:
          filter:
            - domain:
              - input_number
          multiple: false
    event_delay:
      name: Delay Event
      description: >
        Time in seconds changes needs to be active, before acting.
        This will delay the triggered event and filter glitches.
      default: 2
      selector:
        number:
          min: 0
          max: 9
          step: 1
          mode: slider
          unit_of_measurement: seconds
    manually_revert_delay:
      name: Delay Revert from manually setting Radiator
      description: >
        Time in minutes before reverting to schedule after manually setting radiator valve.
        Set to 0, to ignore manually changed temperature.
      default: 90
      selector:
        number:
          min: 0
          max: 300
          step: 1
          mode: slider
          unit_of_measurement: minutes
    action_delay:
      name: Delay Actions
      description: >
        Time in seconds delaying between subsequent actions.
        To ensure the components are ready again.
      default: 2
      selector:
        number:
          min: 0
          max: 9
          step: 1
          mode: slider
          unit_of_measurement: seconds
    winter_mode:
      name: (optional) Winter mode
      description: >
        If used, this needs to be 'on', for heating to be enabled.
        If this entity is 'off', the heating will be disabled.
      default:
      selector:
        entity:
          filter:
            - domain:
              - input_boolean
              - binary_sensor
          multiple: false
    override_max:
      name: (optional) Override valves to max
      description: Activate all valves, to maximum temperature.
      default:
      selector:
        entity:
          filter:
            - domain:
              - input_boolean
              - timer
          multiple: true

    window:
      name: (optional) Window sensor
      description: >
        Window opened sensor or group of sensors, to check.
        If 'on' the window is considered opened and the valves will be shut off.
      default:
      selector:
        entity:
          filter:
            - domain:
              - binary_sensor
          multiple: true
    windowopened_delay:
      name: Delay window opened
      description: >
        Time in minutes window needs to be opened, before acting.
      default: 3
      selector:
        number:
          min: 0
          max: 9
          step: 1
          mode: slider
          unit_of_measurement: minutes

    persons:
      name: (optional) Persons for presence detection
      description: >
        Persons to check present for activating comfort temperature.
        If none of the persons are detected home, the away temperature will be used instead of confort temperature.
        Instead of persons, you can use 'device_tracker' as well.
        If undefined, the script will always set persons_home=1.
      default:
      selector:
        entity:
          filter:
            - domain:
              - person
              - device_tracker
              - input_boolean
          multiple: true
    away_temp:
      name: (optional) Away Temperature
      description: >
        Temperature, to use if no one is at home.
        If unset, eco temperature will be used.
      default:
      selector:
        entity:
          filter:
            - domain:
              - input_number
          multiple: false
    nobodyhome_delay:
      name: Delay nobody home
      description: >
        Time in minutes before acting on no persons at home.
      default: 3
      selector:
        number:
          min: 0
          max: 99
          step: 1
          mode: slider
          unit_of_measurement: minutes

    party_mode:
      name: (optional) Party ongoing (timer or boolean)
      description: >
        If active, heating will be activated.
        During party the scheduler, presence and window open detection will be ignored.
      default:
      selector:
        entity:
          filter:
            - domain:
              - timer
              - input_boolean
          multiple: true
    party_temp:
      name: (optional) Party Temperature
      description: >
        Temperature, to use if party is happening.
        If unset, comfort temperature will be used instead.
      default:
      selector:
        entity:
          filter:
            - domain:
              - input_number
          multiple: false

variables:
  # get the settings to variables
  valves: !input valves
  eco_temp: !input eco_temp
  manually_revert_delay: !input manually_revert_delay
  # interpret settings to state variables
  comfort_temp: >
    {% if comfort_temp_input is not none %}
      {{ states(comfort_temp_input) | float }}
    {% else %}
      {{ eco_temp }}
    {% endif %}
  away_temp: >
    {% if away_temp_input is not none %}
      {{ states(away_temp_input) | float }}
    {% else %}
      {{ eco_temp }}
    {% endif %}
  party_temp: >
    {% if party_temp_input is not none %}
      {{ states(party_temp_input) | float }}
    {% else %}
      {{ comfort_temp }}
    {% endif %}
  windows_opened: >
    {% if window is not none %}
      {{ expand(window) | selectattr('state', 'eq', 'on') | list | count }}
    {% else %}
      0
    {% endif %}
  persons_home: >
    {% if persons is not none %}
      {{ expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count }}
    {% else %}
      -1
    {% endif %}
  # some checking variables for simplification
  is_party: > # party started
    {{ party_mode is not none and expand(party_mode) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}
  is_comfort: > # scheduler unset or active
    {{ scheduler is none or expand(scheduler) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}
  is_override_max: > # override to max set and active
    {{ override_max is not none
      and ( expand(override_max) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 ) }}
  is_winter: > # winter_mode unset or any is on
    {{ winter_mode is none or expand(winter_mode) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}
  is_summer: > # winter_mode set and none is on
    {{ winter_mode is not none and expand(winter_mode) | selectattr('state', 'in', ['on', 'active']) | list | count == 0 }}
  scheduled_preset: >
    {% if is_party %}
      party
    {% else %}
      {% if is_comfort %}
        {% if persons_home == 0 %}
          away
        {% else %}
          comfort
        {% endif %}
      {% else %}
        eco
      {% endif %}
    {% endif %}
  scheduled_temp: >
    {% if is_party %}
      {{ party_temp }}
    {% else %}
      {% if is_comfort %}
        {% if persons_home == 0 %}
          {{ away_temp }}
        {% else %}
          {{ comfort_temp }}
        {% endif %}
      {% else %}
        {{ eco_temp }}
      {% endif %}
    {% endif %}
  is_temp_changed: > # trigger, on temperature changed
    {{ trigger is not none and trigger.platform == 'state' and trigger.attribute == 'temperature' }}
  is_temp_manual: > # trigger, on temperature changed manually
    {{ is_temp_changed and not is_override_max and windows_opened == 0
      and trigger.to_state.attributes.temperature != scheduled_temp }}

  is_scheduler_start: "{{ trigger is not none and trigger.id == 'scheduler_start' }}"
#  current_temp: > # current temperature on trigger
#    {% if trigger is not none and trigger.to_state is not none %}
#      {{ trigger.to_state.attributes.current_temperature | float }}
#    {% else %}
#      -1.0
#    {% endif %}
  #current_temp: "{{ trigger.to_state is not none and states(trigger.to_state.attributes.current_temperature) | default(-1.0) | float }}"

trigger_variables:
  scheduler: !input scheduler
  comfort_temp_input: !input comfort_temp
  window: !input window
  override_max: !input override_max
  winter_mode: !input winter_mode
  persons: !input persons
  away_temp_input: !input away_temp
  party_mode: !input party_mode
  party_temp_input: !input party_temp

trigger:
  # platform events
  - platform: homeassistant
    event: start
  # configuration changes occured
  - platform: state
    entity_id:
      #- !input scheduler # handled by template later
      - !input comfort_temp
      #- !input away_temp # state trigger doesn't work with optional, if unset
      #- !input party_temp # state trigger doesn't work with optional, if unset
    for:
      seconds: !input event_delay

  - platform: state # temperature setting changed
    id: 'TRV_temp_changed'
    entity_id: !input valves
    attribute: temperature
    alias: 'temperature changed on TRV'
    #not_to: {{ scheduled_temp }} # unluckily this is not working
    for:
      minutes: !input manually_revert_delay
      seconds: 13 # delay always, to ensure manually handling is done

  - platform: template # scheduler switching to on
    id: "scheduler_start"
    value_template: >
      {{ scheduler is not none and is_state(scheduler, 'on') }}
    alias: 'scheduler switching to on'
    for:
      seconds: !input event_delay
  - platform: template # scheduler switching to off
    id: "scheduler_end"
    value_template: >
      {{ scheduler is not none and is_state(scheduler, 'off') }}
    alias: 'scheduler switching to off'
    for:
      seconds: !input event_delay
  - platform: template # winter mode switching to on
    id: "winter_start"
    value_template: >
      {{ winter_mode is not none and is_state(winter_mode, 'on') }}
    alias: 'winter mode switching to on'
    for:
      seconds: !input event_delay
  - platform: template # winter mode switching to off
    id: "winter_end"
    value_template: >
      {{ winter_mode is not none and is_state(winter_mode, 'off') }}
    alias: 'winter mode switching to off'
    for:
      seconds: !input event_delay
  - platform: template # override mode switching to on
    id: "override_start"
    value_template: >
      {{ override_max is not none
        and ( expand(override_max) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 ) }}
    alias: 'override switching to on'
    for:
      seconds: !input event_delay
  - platform: template # override mode switching to off
    id: "override_end"
    value_template: >
      {{ override_max is not none
        and ( expand(override_max) | selectattr('state', 'in', ['on', 'active']) | list | count == 0 ) }}
    alias: 'override switching to off'
    for:
      seconds: !input event_delay
  - platform: template # windows closed (opened == 0)
    id: "window_closed"
    value_template: >
      {{ window is not none and
      ( expand(window) | selectattr('state', 'eq', 'on') | list | count == 0 ) }}
    alias: 'windows closed'
    for:
      #minutes: !input windowopened_delay # don't use on closing windows
      seconds: !input event_delay
  - platform: template # windows opened > 0
    id: "window_opened"
    value_template: >
      {{ window is not none and
      ( expand(window) | selectattr('state', 'eq', 'on') | list | count > 0 ) }}
    alias: 'window opened'
    for:
      minutes: !input windowopened_delay
  - platform: template # nobody home
    id: "nobody_home"
    value_template: >
      {{ persons is not none and expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count == 0 }}
    alias: 'nobody home'
    for:
      minutes: !input nobodyhome_delay
  - platform: template # somebody home
    id: "somebody_home"
    value_template: >
      {{ persons is not none and expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count != 0 }}
    alias: 'someone came home'
    for:
      #minutes: !input nobodyhome_delay # don't use on getting home
      seconds: !input event_delay
  - platform: template # party mode switching to on
    id: "party_start"
    value_template: >
      {{ party_mode is not none and ( expand(party_mode) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 ) }}
    alias: 'party mode switching to on'
    for:
      seconds: !input event_delay
  - platform: template # party mode switching to off
    id: "party_end"
    value_template: >
      {{ party_mode is not none and ( expand(party_mode) | selectattr('state', 'in', ['on', 'active']) | list | count == 0 ) }}
    alias: 'party mode switching to off'
    for:
      seconds: !input event_delay

mode: parallel # run in parallel
max: 3 # no more than 3 running at once
# maybe mode should be changed to queued to prevent missing changes
#mode: restart # stop and restart on multiple calls
#max_exceeded: silent

action:
  - service: system_log.write
    data:
      message: >
        Heating Control by march42
        triggered with {{ trigger }}
        valves {{ valves }}
        scheduled {{ scheduled_preset }}, {{ scheduled_temp }}
      level: info
      logger: blueprints.march42.climate

  - if: # temperature on TRV changed
      - condition: trigger
        id: 'TRV_temp_changed'
    then: # temperature changed trigger
      - if: # ignore valid changes
          - condition: template
            value_template: > # temp changed trigger
              {{ is_temp_manual and manually_revert_delay > 0 }}
        then:
          - service: system_log.write
            data:
              message: >
                revert from manually temperature changed,
                {{ trigger.from_state.attributes.temperature }} to {{ trigger.to_state.attributes.temperature }}
              level: info
              logger: blueprints.march42.climate
        else:
          - stop: "ignore changed temperature, not manually or manually_revert_delay == 0"

  # set TRVs
  - if:
      - condition: template
        value_template: "{{ is_override_max }}"
    then: # override/maintenance mode
      - service: climate.set_hvac_mode
        target:
          entity_id: !input valves
        data:
          hvac_mode: 'heat'
      - delay:
          seconds: !input action_delay
      - service: climate.set_temperature
        data:
          entity_id: !input valves
          temperature: 99.0
    else:
      - if:
          - condition: template
            value_template: "{{ is_summer or (windows_opened > 0) }}"
        then: # summer_mode (winter_mode==off) or windows opened
          - service: climate.set_hvac_mode
            target:
              entity_id: !input valves
            data:
              hvac_mode: 'off'
        else: # scheduled heating
          - service: climate.set_hvac_mode
            target:
              entity_id: !input valves
            data:
              hvac_mode: 'heat'
          - delay:
              seconds: !input action_delay
          - if: # boost temp, if scheduled start and temp 2° below
              - condition: template
                value_template: > # trigger.to_state has no value here
                  {{ is_scheduler_start and scheduled_temp | float - states(trigger.to_state.attributes.current_temperature) | float >= 2.0 }}
            then:
              - service: system_log.write
                data:
                  message: >
                    starting with boost on {{ trigger.entity_id }}
                    current temperature {{ trigger.to_state.attributes.current_temperature }} below {{ scheduled_temp }}
                  level: info
                  logger: blueprints.march42.climate
              - service: climate.set_temperature
                data:
                  entity_id: !input valves
                  temperature: 99.0
              - delay:
                  minutes: 15
          - service: climate.set_temperature
            data:
              entity_id: !input valves
              temperature: "{{ scheduled_temp | float }}"
