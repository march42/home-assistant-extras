blueprint:
  name: TEST Input Selector
  description: |
    **TEST** for Input Selector
    **Version** 1.00-b03
    **Repository** [march42/home-assistant-extras](https://github.com/march42/home-assistant-extras/)

    I created this TEST for input selector to determine when and why my
    selectors disappear. In some of my automation blueprints the input
    selector are not shown. I assume this is caused by the default
    value definition. So i need some kind of test, to ensure, before
    opening an issue on [GitHub](https://github.com/home-assistant/core/issues?q=is%3Aissue+input+selector)

    **WORK AROUND**

    - for selector with attribute **multiple==false use empty entity** `default:`
    - for selector with attribute **multiple==true use empty list** `default: []`

    **WORK IN PROGRESS**

    - looks a lot like [Blueprint !import problem - #175816](https://github.com/home-assistant/core/issues/175816)
    - maybe related to [Fix entities listed in template blueprints - #171861](https://github.com/home-assistant/core/pull/171861)

    Copyright (C) 2026 Marc Hefter

