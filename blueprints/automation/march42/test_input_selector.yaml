    GNU General Public License for more details.

    Please see the GNU General Public License at [https://www.gnu.org/licenses/](https://www.gnu.org/licenses/).
  author: march42
  source_url: https://github.com/march42/home-assistant-extras/blob/main/config/blueprints/automation/test_input_selector.yaml
  domain: automation
  homeassistant:
    min_version: "2024.10.0" # some changes were made to the blueprint schema

  input:
    trv: # choose TRV
      name: TRV
      description: Thermostats (thermostatic regulated valve) to be controlled with this settings
      selector:
        device:
          multiple: true
          entity:
            - domain: climate
    window_sensor: # contact sensor on windows or doors
      name: (Optional) Window sensor
      description: |
        Window opened sensor or group of sensors, to check.
        If 'on' the window is considered opened and the valves will be shut off.
      selector:
        entity:
          multiple: true
          filter:
            - domain:
              - binary_sensor
      default: # if multiple==true an empty list would be necessary
    door_sensor: # contact sensor on windows or doors
      name: (Optional) Door sensor
      description: |
        Window opened sensor or group of sensors, to check.
        If 'on' the window is considered opened and the valves will be shut off.
      selector:
        entity:
          multiple: true
          filter:
            - domain:
              - binary_sensor
      default: null # if multiple==true an empty list would be necessary
    test_sensor: # contact sensor on windows or doors
      name: (Optional) Test sensor
      description: |
        Window opened sensor or group of sensors, to check.
        If 'on' the window is considered opened and the valves will be shut off.
      selector:
        entity:
          filter:
            - domain:
              - binary_sensor
      default: # if multiple==false an empty variable is right
    persons:
      name: (optional) Persons for presence detection
      description: |
        Persons to check present for activating comfort temperature.
        If none of the persons are detected home, the away temperature will be used instead of confort temperature.
        Instead of persons, you can use 'device_tracker' as well.
        If undefined, the script will always set persons_home=-1.
      selector:
        entity:
          multiple: true
          filter:
            - domain:
              - person
              - device_tracker
              - input_boolean
      default: [] # if multiple==true an empty list is necessary
    presence:
      name: Presence detection
      description: |
        Persons to check present for activating comfort temperature.
        If none of the persons are detected home, the away temperature will be used instead of confort temperature.
        Instead of persons, you can use 'device_tracker' as well.
        If undefined, the script will always set persons_home=-1.
      selector:
        entity:
          multiple: true
          filter:
            - domain:
              - person
              - device_tracker
              - input_boolean

trigger_variables:
  - input_trv: !input trv
  - input_window_sensor: !input window_sensor
  - input_door_sensor: !input door_sensor
  - input_test_sensor: !input test_sensor
  - input_persons: !input persons
  - input_presence: !input presence

variables:
  - trv: "{{ input_trv }}"
  - window_sensor: "{{ input_window_sensor }}"
  - door_sensor: "{{ input_door_sensor }}"
  - test_sensor: "{{ input_test_sensor }}"
  - persons: "{{ input_persons }}"
  - presence: "{{ input_presence }}"

triggers: []
conditions: []
actions:
  - delay: [00:00:01]

mode: restart
#max: 3 # default 10
#max_exceeded: info # default warning
trace:
  stored_traces: 10
