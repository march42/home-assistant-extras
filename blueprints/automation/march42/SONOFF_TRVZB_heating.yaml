blueprint:
  name: Sonoff TRVZB Heating v2
  description: |
    **Heating Control for Sonoff TRVZB**
    **Version** 2.02-b15
    **Repository** [march42/home-assistant-extras](https://github.com/march42/home-assistant-extras/)

    - sets target temperature according to configured settings
      - eco temp for heating period
      - comfort temp for scheduled time of day
      - open window temp, if window opened
      - away temp, if nobody home
    - manual winter mode activation via `input_boolean` helper or `binary_sensor`
    - comfort heating activation via `scheduler` or `binary_sensor`
    - remote window contact sensors for open window detection
    - choose `person`, `device_tracker` or `input_boolean` for somebody at home detection
    - specific functionality for Sonoff TRVZB
      - sets external temperature from configured remote sensor
    - manual events
      - HEATING_RESET_TO_SCHEDULER activate scheduled temperature on the TRVs
      - HEATING_SET_ECO override TRVs target temperature to eco temp

    temperature settings and correlations, i found to be useful
    - open window temp 7.0°C
      - sufficient for frost protection
    - away temp 12-15 °C
      - if nobody at home it doesn't bother if chilly
      - when coming back it can take a few moments longer to heat up to temperature
    - eco temp 15°C
      - over night
      - during the day, when i usually wear thicker clothes
    - comfort temp 18°C-21°C
      - in the evening when i want to relax
      - free days, when i'm having a long brunchy breakfast
    **open window temp < away temp <= eco temp <= comfort temp**

    selection logic
    1. open window temp if one or more windows opened
    2. away temp if persons at home count == 0
    3. comfort temp if comfort scheduler active
    4. eco temp otherwise

    **LICENSE**
    Copyright (C) 2023-2026 Marc Hefter

    This program is free software: you can redistribute it and/or modify
    it under the terms of the GNU General Public License as published by
    the Free Software Foundation, either version 3 of the License, or
    (at your option) any later version.

    This program is distributed in the hope that it will be useful,
    but WITHOUT ANY WARRANTY; without even the implied warranty of
    MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
    GNU General Public License for more details.

    Please see the GNU General Public License at [https://www.gnu.org/licenses/](https://www.gnu.org/licenses/).
  author: march42
  source_url: https://github.com/march42/home-assistant-extras/blob/main/config/blueprints/automation/SONOFF_TRVZB_heating.yaml
  domain: automation
  homeassistant:
    #min_version: "2024.6.0" # input sections were added
    min_version: "2024.10.0" # some changes were made to the blueprint schema

  input:
    input_trv: # choose Sonoff TRVZB
      name: TRVZB radiator valve
      description: Thermostats (thermostatic regulated valve) to be controlled with this settings
      selector:
        entity:
          multiple: true
          filter:
            - domain: climate
    manually_revert_delay:
      name: Revert from manually setting target temperature
      description: |
        Time in minutes before reverting to schedule after manually setting radiator valve.
        Set to 0, to ignore manually changed temperature.
      default: 0
      selector:
        number:
          min: 0
          max: 120
          step: 1
          mode: slider
          unit_of_measurement: minutes

    section_remote_sensor: # remote temperature sensor settings
      name: Remote Temperature Sensor
      description: |
        If `Remote temperature sensor` is configured, it will be watched for temperature changes.
        The changes will be ignored, if triggered within configured deskew time period.
        The changed temperature value is written to the TRVs
        `external_temperature_sensor_value` value attribute
        if the TRVs `external_temperature_sensor` setting is activated.
      input:
        temperature_source: # some thermometer reporting to Home Assistant
          name: (Optional) remote temperature sensor
          description: |
            External temperature sensor, to use for meassurement.
            If you want to use more than one sensor, create a helper to combine several sensors with arithmetic mean and use this helper as input here.
            The target TRVZB's own temperature is not considered a valid source.
          default:
          selector:
            entity:
              filter:
                domain: sensor
                device_class: temperature
        temperature_source_deskew: # time in minutes, between changes
          name: Deskew temperature changes
          description: |
            Time in minutes to filter glitches. Setting to 0 will disable this filter.
            Temperature changes from remote sensor will be ignored, if triggered within this time period.
            This saves battery life of the TRV, by not sending changes too rapidly.
            Rapid changes of temperature, e.g. when opening window, will be missed or misinterpreted.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              mode: slider
              unit_of_measurement: minutes

    section_temperature: # target temperature settings
      name: Target Temperature Settings
      description: |
        Settings for winter mode, target temperature and comfort temperature schedule.
      input:
        winter_mode: # restrict actions to winter, to save battery on TRVZB
          name: (Optional) Winter mode
          description: >
            If selected, this needs to be 'on' or 'active' to enable heating services.
            `Winter mode` saving resources disabling setting the TRV during summer,
            when heating services are not needed.
          default:
          selector:
            entity:
              filter:
                - domain:
                  - input_boolean
                  - binary_sensor
              multiple: false
        scheduler: # scheduler helper, to activate comfort temperature
          name: (Optional) Scheduler for comfort temperature
          description: >
            Scheduler to specify times, to activate comfort or away temperature.
            While 'off', eco temperature will be used.
          selector:
            entity:
              filter:
                - domain:
                  - schedule
                  - binary_sensor
              multiple: false
          default:
        min_temp: # default value minimum temperature
          name: Eco Temperature
          description: >
            Temperature, to use as Eco target temperature.
          default: 15
          selector:
            number:
              min: 5.0
              max: 25.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        day_temp: # comfort temperature
          name: Comfort Temperature
          description: >
            Temperature, to use for active heating.
          default: 18
          selector:
            number:
              min: 5.0
              max: 25.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C

    section_opened_window: # opened window detection settings
      name: Opened Window Detection
      description: |
        Settings for opened window detection.
      input:
        window_sensor: # contact sensor on windows or doors
          name: (Optional) Window sensor
          description: |
            Window opened sensor or group of sensors, to check.
            If 'on' the window is considered opened.
            If window stays opened beyond delay, to target temperature will be set accordingly.
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                  - binary_sensor
          default: [] # list is necessary for multiple==true
        windowopened_delay:
          name: Delay window opened
          description: >
            Time in minutes window needs to be opened, before acting.
          default: 3 # it takes some time to cool down a room
          selector:
            number:
              min: 0
              max: 9
              step: 1
              mode: slider
              unit_of_measurement: minutes
        opened_temp:
          name: Opened Window Temperature
          description: >
            Temperature, to use if window gets opened.
            Should still ensure frost protection.
          default: 7.0 # minimum frost protection
          selector:
            number:
              min: 5.0
              max: 25.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C

    section_presence: # presence detection settings
      name: Presence Detection
      description: |
        Settings for presence detection.
      input:
        persons:
          name: (Optional) Persons for presence detection
          description: |
            Persons to check present for activating comfort temperature.
            If none of the persons are detected home, the away temperature will be used instead of confort temperature.
            Instead of persons, you can use 'device_tracker' as well.
            You can use an `input_boolean` helper e.g. `guests at home` to override detection.
            Specifying a presence detection sensor can automate heating on room level.
            If undefined, the script will always set persons_home=-1 so it's not 0.
          selector:
            entity:
              multiple: true
              filter:
                - domain:
                  - person
                  - device_tracker
                  - input_boolean
                  - binary_sensor
          default: []
        away_temp:
          name: Away Temperature
          description: >
            Temperature, to use if no one is at home.
            Setting this too low, will lead to extra long heating when coming back home.
          default: 12.0 # prevent the room furnishings from chilling too much
          selector:
            number:
              min: 5.0
              max: 25.0
              step: 0.5
              mode: slider
              unit_of_measurement: °C
        nobodyhome_delay:
          name: Delay nobody home
          description: >
            Time in minutes before acting on no persons home.
            After this delay the TRVs will be set to corresponding target temperature.
          default: 3 # gives you some time, to get your mail
          selector:
            number:
              min: 0
              max: 99
              step: 1
              mode: slider
              unit_of_measurement: minutes

    section_fine_tuning: # fine tuning
      name: Fine Tuning
      description: |
        Setting fine tuning script behaviour.
      input:

        event_delay: # delaying event trigger to filter glitches
          name: Delay Event
          description: >
            Time in seconds changes needs to be active, before acting.
            This will delay the triggered event and filter glitches.
          default: 2
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: slider
              unit_of_measurement: seconds
        action_delay: # delay between actions, to ensure components have time to get ready again
          name: Delay Actions
          description: >
            Time in seconds delaying between subsequent actions.
            To ensure the components are ready again.
          default: 0.2 # who knows, this should be unnecessary
          selector:
            number:
              min: 0.0
              max: 9.0
              step: 0.2
              mode: slider
              unit_of_measurement: seconds

        enable_min_max_correct: # correct min_temp and max_temp to fit target_temp
          name: Enable Min/Max correct
          description: >
            Try to correct the `min_temp` and `max_temp` settings.
            Will not work on all TRVs.
            The TRV needs to expose min_heat_setpoint_limit and max_heat_setpoint_limit attributes.
          default: false
          selector:
            boolean:
        enable_winter_set: # set winter mode on manual events HEATING_WINTER_START and HEATING_WINTER_STOPP
          name: Enable winter mode toggle
          description: >
            Try to turn on and off choosen winter mode.
            If you use input_boolean helper.
            HEATING_WINTER_START will lead to turn_on
            HEATING_WINTER_STOPP will lead to turn_off

            It's sufficient if one instance of the automation reacts on this.
          default: false
          selector:
            boolean:
        enable_system_events: # enable Home Assistant system events
          name: Enable Home Assistant system events
          description: >
            Activate receiving and handling of Home Assistant system events.
            On homeassistant_start event to set scheduled temperature gets triggered.
            On homeassistant_shutdown it'll trigger event to set eco temperature.
          default: false
          selector:
            boolean:

triggers:
  - alias: "Temperature on remote sensor changed"
    id: "external_temperature_sensor"
    trigger: temperature.changed
    target:
      entity_id: !input temperature_source
    options:
      threshold:
        type: any
  - alias: "Target temperature on TRV changed"
    id: 'TRV_temp_changed'
    platform: state # temperature setting changed
    entity_id: !input input_trv
    attribute: temperature
    #not_to: {{ scheduled_temp }} # unluckily this is not working
    not_to:
      - "unknown"
      - "unavailable"
    for:
      minutes: !input manually_revert_delay
      seconds: 13 # delay always, to ensure manually handling is done

  - alias: "Scheduler switched to ON"
    id: "scheduler_start" # scheduler switching to on
    platform: template
    value_template: >
      {{ scheduler is not none and is_state(scheduler, ['on', 'active']) }}
    for:
      seconds: !input event_delay
  - alias: "Scheduler switched to OFF"
    id: "scheduler_end" # scheduler switching to off
    platform: template
    value_template: >
      {{ scheduler is not none and is_state(scheduler, ['off', 'inactive']) }}
    for:
      seconds: !input event_delay
  - alias: "Winter mode switched to ON"
    id: "winter_start" # winter mode switching to on
    platform: template
    value_template: >
      {{ winter_mode is not none and is_state(winter_mode, 'on') }}
    for:
      seconds: !input event_delay
  - alias: "Winter mode switched to OFF"
    id: "winter_end" # winter mode switching to off
    platform: template
    value_template: >
      {{ winter_mode is not none and is_state(winter_mode, 'off') }}
    for:
      seconds: !input event_delay

  - alias: "Window opened" # windows opened > 0
    id: "window_opened"
    platform: template
    value_template: >
      {{ window_sensor is not none and
        expand(window_sensor) | selectattr('state', 'eq', 'on') | list | count > 0 }}
    for:
      minutes: !input windowopened_delay
  - alias: "All windows closed" # windows closed (opened == 0)
    id: "window_closed"
    platform: template
    value_template: >
      {{ window_sensor is not none and
        expand(window_sensor) | selectattr('state', 'eq', 'on') | list | count == 0 }}
    for: # don't use windowopened_delay on closing windows
      seconds: !input event_delay
  - alias: "Nobody home" # persons count == 0
    id: "nobody_home" # nobody home
    platform: template
    value_template: >
      {{ persons is not none and
        expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count == 0 }}
    for:
      minutes: !input nobodyhome_delay
  - alias: "Somebody came home" # persons count != 0
    id: "somebody_home" # somebody home
    platform: template
    value_template: >
      {{ persons is not none and
        expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count > 0 }}
    for: # don't use nobodyhome_delay on someone getting home
      seconds: !input event_delay

  # platform events
  - alias: "Home Assistant startet"
    id: "homeassistant_start"
    platform: homeassistant
    event: start
    enabled: !input enable_system_events
  - alias: "Home Assistant stopping"
    id: "homeassistant_shutdown"
    platform: homeassistant
    event: shutdown
    enabled: !input enable_system_events

  # manual events for remote controlling from other automations
  - alias: "Manual event HEATING_***"
    id: "manual_event"
    platform: event
    event_type:
      - "HEATING_RESET_TO_SCHEDULER"
      - "HEATING_SET_ECO"
      - "HEATING_WINTER_START"
      - "HEATING_WINTER_STOPP"

conditions: [] # TODO: only execute if necessary
  #- condition: or
  #  conditions:
  #    - value_template: > # execute during winter
  #        {{ winter_mode is none
  #          or expand(winter_mode) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}
  #      condition: template
  #      enabled: false
  #    - id: 'winter_end' # winter ending is necessary, is_winter is now false
  #      condition: trigger
  #      enabled: false
  #    - id: 'winter_start' # maybe winter starting is unnecessary, because is_winter is now true
  #      condition: trigger
  #      enabled: false
  #    - id: 'manual_event' # allways run for manual events
  #      condition: trigger
  #      enabled: false

trigger_variables:
  winter_mode: !input winter_mode
  scheduler: !input scheduler
  window_sensor: !input window_sensor
  persons: !input persons

variables:
  # state checking and calculation
  seconds_since_last_triggered: > # calculate seconds since last triggered, will be VERY high on first trigger
    {% set ts_now = as_timestamp(now()) %}
    {% if this.attributes.last_triggered is not none %}
      {% set ts_last_triggered = as_timestamp(this.attributes.last_triggered | default(0)) %}
      {{ ts_now - ts_last_triggered }}
    {% else %}
      {{ ts_now | int }}
    {% endif %}

  # TRV settings
  input_trv: !input input_trv
  thermostat_entities: > # create list of _thermostat entities from device list
    {{ expand(input_trv)
      | selectattr("state", "ne", ["unavailable", "unknown"])
      | map(attribute="entity_id") | list }}
  manually_revert_delay: !input manually_revert_delay
  enable_min_max_correct: !input enable_min_max_correct

  # synching external temperature source
  temperature_source: !input temperature_source
  temperature_source_deskew: !input temperature_source_deskew

  # value settings
  min_temp: !input min_temp
  eco_temp: "{{ min_temp }}"
  day_temp: !input day_temp
  comfort_temp: "{{ day_temp }}"
  opened_temp: !input opened_temp
  away_temp: !input away_temp
  event_delay: !input event_delay
  action_delay: !input action_delay

  # state and environment
  windows_opened: > # count opened windows
    {% if window_sensor is not none %}
      {{ expand(window_sensor) | selectattr('state', 'in', ['on','active']) | list | count }}
    {% else %}
      -1
    {% endif %}
  persons_home: > # count the persons home
    {% if persons is not none %}
      {{ expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count }}
    {% else %}
      -1
    {% endif %}
  is_winter: > # winter_mode unset or any is on
    {{ winter_mode is none or expand(winter_mode) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}
  is_comfort: > # scheduler unset or active
    {{ scheduler is none or expand(scheduler) | selectattr('state', 'in', ['on', 'active']) | list | count > 0 }}

  # enumerate scheduled temperature
  scheduled_preset: >
    {% if windows_opened > 0 %}
      opened
    {% elif persons_home == 0 %}
      away
    {% elif is_comfort %}
      comfort
    {% else %}
      eco
    {% endif %}
  scheduled_temp: >
    {% if windows_opened > 0 %}
      {{ opened_temp }}
    {% elif persons_home == 0 %}
      {{ away_temp }}
    {% elif is_comfort %}
      {{ comfort_temp }}
    {% else %}
      {{ eco_temp }}
    {% endif %}

  # manual event
  is_manual_event: "{{ trigger is not none and trigger.id == 'manual_event' }}"
  manual_event: > # return none or event_type
    {% if trigger is not none and trigger.id == 'manual_event' and trigger.event.event_type is not none %}
      {{ trigger.event.event_type }}
    {% else %}
      none
    {% endif %}

action:

  - choose: # take actions for specific conditions
    - conditions: # remote temperature sensor changed
        - id: 'external_temperature_sensor'
          condition: trigger
        - value_template: '{{ is_winter }}'
          condition: template
        - value_template: '{{ seconds_since_last_triggered >= temperature_source_deskew * 60 }}'
          # sensor.last_reported | default(sensor.last_updated, true)
          condition: template
        - value_template: '{{ temperature_source is not none and trigger.entity_id is not none }}'
          condition: template
      sequence:
        - variables:
            source_entity: > # the triggering temperature sensor
              {% if trigger is not none and trigger.entity_id is not none %}
                {{ trigger.entity_id }}
              {% else %}
                {{ temperature_source }}
              {% endif %}
            target_entities: > # list of external_temperature_sensor_value entities (if enabled at TRV)
              {% set ns = namespace(entity_list=[]) %}
              {% for trv in input_trv %}
                {% set dev = device_id(trv) %}
                {% set sensor_value = (device_entities(dev) or [])
                  | select('match', '^number\\..*_external_temperature_sensor_value$')
                  | list | first | default('', true) %}
                {% set sensor_active = (device_entities(dev) or [])
                  | select('match', '^switch\\..*_external_temperature_sensor$')
                  | list | first | default(false, true) %}
                {% if is_state(sensor_active,'on') %}
                  {% set ns.entity_list = ns.entity_list + [sensor_value] %}
                {% endif %}
              {% endfor %}
              {{ ns.entity_list }}
            temperature_value: > # convert external temperature to degree celsius
              {% set temperature = states(source_entity) | float %}
              {% set unit = state_attr(source_entity, 'unit_of_measurement') | default('°C') %}
              {{ ((temperature - 32) * 5 / 9 if unit == '°F'
                  else temperature - 273.15 if unit == 'K'
                  else temperature) | round(1) }}
        - action: number.set_value # setting the entities works with multiple TRVs and maybe other devices as well
          target:
            entity_id: "{{ target_entities }}"
          data:
            value: "{{ temperature_value }}"
        - stop: "_external_temperature_sensor_value set"
    - conditions: # temperature on TRV changed
        - condition: trigger
          id: 'TRV_temp_changed'
      sequence:
        - if: # ignore determined changes
            - condition: template
              value_template: > # if TRV_manual_override
                {{ manually_revert_delay != 0
                  and trigger is not none and trigger.id == 'TRV_temp_changed'
                  and trigger.entity_id is not none
                  and state_attr(trigger.entity_id,"temperature") | float != scheduled_temp }}
          then:
            - delay: # just do nothing, TODO: is there a BREAK action
                seconds: 0
              enabled: false
          else:
            - stop: "ignore, not manually changed or manually_revert_delay == 0"

    - conditions: # winter starting
        - id: 'HEATING_WINTER_START'
          condition: trigger
      sequence:
        - action: homeassistant.turn_on
          target:
            entity_id: !input winter_mode
          data: {}
          enabled: !input enable_winter_set
        - stop: "stop, after activating winter mode"
    - conditions: # winter started
        - id: 'winter_start'
          condition: trigger
      sequence:
        - action: climate.turn_on
          target:
            entity_id: "{{ thermostat_entities }}"
        - delay:
            seconds: !input action_delay
        # the target temperature will be set later
    - conditions: # winter stopping
        - id: 'HEATING_WINTER_STOPP'
          condition: trigger
      sequence:
        - action: homeassistant.turn_off
          target:
            entity_id: !input winter_mode
          data: {}
          enabled: !input enable_winter_set
        - stop: "stop, after deactivating winter mode"
    - conditions: # winter ended
        - id: 'winter_end'
          condition: trigger
      sequence:
        - action: climate.turn_off
          target:
            entity_id: "{{ thermostat_entities }}"
        - stop: "stop after turning off TRV when winter started"

    ### removed... now continues to temperature setting
    #- conditions: # home assistant starting
    #    - condition: trigger
    #      id: 'homeassistant_start'
    #  sequence:
    #    - event: HEATING_RESET_TO_SCHEDULER
    #      event_data:
    #        reason: homeassistant_start
    #    - stop: "homeassistant_start triggered HEATING_RESET_TO_SCHEDULER"
    #- conditions: # home assistant shutting down
    #    - condition: trigger
    #      id: 'homeassistant_shutdown'
    #  sequence:
    #    - event: HEATING_SET_ECO
    #      event_data:
    #        reason: homeassistant_shutdown
    #    - stop: "homeassistant_shutdown triggered HEATING_SET_ECO"

    - conditions: # continue to set target temperature
        - value_template: '{{ is_winter }}'
          condition: template
          enabled: true
        - condition: or
          conditions:
            - condition: template # reset target temp to scheduler
              value_template: "{{ is_manual_event and manual_event == 'HEATING_RESET_TO_SCHEDULER' }}"
            - condition: template # manually set ECO temp
              value_template: "{{ is_manual_event and manual_event == 'HEATING_SET_ECO' }}"
            - id: 'scheduler_start'
              condition: trigger
            - id: 'scheduler_end'
              condition: trigger
            - id: 'window_opened'
              condition: trigger
            - id: 'window_closed'
              condition: trigger
            - id: 'nobody_home'
              condition: trigger
            - id: 'somebody_home'
              condition: trigger
            - id: 'homeassistant_start'
              condition: trigger
            - id: 'homeassistant_shutdown'
              condition: trigger
      sequence:
        - delay: # just do nothing, temp is set later
            seconds: 0
          enabled: false

    default:  # just in case I missed something
      - service: system_log.write
        data:
          message: >
            Heating Control by march42
            triggered with {{ trigger }}
            TRV {{ thermostat_entities }}
          level: info
          logger: blueprints.march42.climate
      - stop: "not changing temperature during unplanned events"

  # in the end, we set the scheduled target temperature
  - if: # only in Winter Mode
      - condition: template
        value_template: "{{ is_winter }}"
    then:
      - variables:
          target_temp: > # manually override target temperature
            {% if (is_manual_event and manual_event == 'HEATING_SET_ECO')
              or (trigger is not none and trigger.id | default('',true) == 'homeassistant_shutdown') %}
              {{ eco_temp }}
            {% else %}
              {{ scheduled_temp }}
            {% endif %}
          minimum_entities: > # list of min_temp entities blocking change
            {# number.badezimmer_hkr_min_heat_setpoint_limit #}
            {% set ns = namespace(entity_list=[]) %}
            {% for trv in input_trv %}
              {% set dev = device_id(trv) %}
              {% set number_value = (device_entities(dev) or [])
                | select('match', '^number\\..*_min_heat_setpoint_limit$')
                | list | first | default('', true) %}
              {% if target_temp < states(number_value) | float(0.0) %}
                {% set ns.entity_list = ns.entity_list + [number_value] %}
              {% endif %}
            {% endfor %}
            {{ ns.entity_list }}
          maximum_entities: > # list of max_temp entities blocking change
            {# number.badezimmer_hkr_max_heat_setpoint_limit #}
            {% set ns = namespace(entity_list=[]) %}
            {% for trv in input_trv %}
              {% set dev = device_id(trv) %}
              {% set number_value = (device_entities(dev) or [])
                | select('match', '^number\\..*_max_heat_setpoint_limit$')
                | list | first | default('', true) %}
              {% if target_temp > states(number_value) | float(30.0) %}
                {% set ns.entity_list = ns.entity_list + [number_value] %}
              {% endif %}
            {% endfor %}
            {{ ns.entity_list }}
      # prevent [Error: Provided temperature 7.0 is not valid. Accepted range is 12.0 to 25.0]
      - action: number.set_value # setting the min and max if necessary
        target:
          entity_id: "{{ minimum_entities }}"
        data:
          value: "{{ target_temp }}"
        enabled: !input enable_min_max_correct
      - action: number.set_value # setting the min and max if necessary
        target:
          entity_id: "{{ maximum_entities }}"
        data:
          value: "{{ target_temp }}"
        enabled: !input enable_min_max_correct
      # now, the delay between actions
      - delay: # action_delay
          seconds: !input action_delay
        enabled: true
      # finally set the target temperature
      - action: climate.set_temperature
        target:
          entity_id: "{{ thermostat_entities }}"
        data:
          temperature: "{{ target_temp }}"
          hvac_mode: heat

mode: queued
max: 5
max_exceeded: warning
