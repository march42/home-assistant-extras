blueprint:
  name: Wake Up Light
  description: >
    **WakeUpLight**
    **Version** 1.02-b12

    **Repository** [march42/home-assistant-extras](march42/home-assistant-extras/)


    **Functions**

    Gradually increase the lights, before the alarm goes off.

    Check for persons at home, to prevent actions when out.
    Check for low illumination, to prevent lights when nobody needs it.


    Copyright (C) 2023-2026 Marc Hefter


    This program is free software: you can redistribute it and/or modify
    it under the terms of the GNU General Public License as published by
    the Free Software Foundation, either version 3 of the License, or
    (at your option) any later version.


    This program is distributed in the hope that it will be useful,
    but WITHOUT ANY WARRANTY; without even the implied warranty of
    MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the
    GNU General Public License for more details.


    Please see the GNU General Public License at [https://www.gnu.org/licenses/](https://www.gnu.org/licenses/).
  author: march42
  source_url: https://github.com/march42/home-assistant-extras/blob/main/config/blueprints/automation/WakeUpLight.yaml
  domain: automation

  input:
    alarm: # the alarm to check
      name: Alarm
      description: >
        The timestamp (next_alarm entity) to trigger on.

        Something like **sensor.<smartphone>_next_alarm** from the HomeAssistant smart phone APP.
        The sensor **Next Alarm** must be enabled in the smart phone APP settings.
      selector:
        entity:
          #multiple: true # multiple wont work without further changes, maybe trigger template
          filter:
            device_class: timestamp

    prealarm_time:
      name:  Pre Alarm Time
      description: Time (in minutes) before the alarm goes off, to start dimming up the lights.
      default: -30
      selector:
        number:
          min: -60
          max: 0
          step: 5
          unit_of_measurement: minutes

    persons: # only if user is home
      name: (optional) Persons for presence detection
      description: >
        Persons to check present for activating the wake up light.

        Should be **device_tracker.<smartphone>**, when using the Next Alarm sensor.
      default:
      selector:
        entity:
          multiple: true
          filter:
            - domain:
              - person
              - device_tracker
              - input_boolean

    lights: # the lights to use
      name: Light(s)
      description: >
        The light(s) to use for the automation.

        The first configured **light entity** will act as master for looping the colors.
      selector:
        entity:
          multiple: true
          filter:
            domain: light

    target_brightness:
      name: Target Brightness
      description: The lamp will be dimming up to this brightness level.
      default: 128
      selector:
        number:
          min: 1
          max: 255
          step: 1
    target_kelvin:
      name: Target Light Temperature
      description: The lamp will be stepping up to this temperature level.
      default: 5000
      selector:
        number:
          min: 2000
          max: 6500
          step: 100

    luxmeter: # the illumination sensors to check
      name: (optional) Luxmeter(s)
      description: >
        The luxmeter(s) to use for the automation.
      default:
      selector:
        entity:
          multiple: true
          filter:
            domain: sensor
            device_class: illuminance

    stepping_count:
      name:  Stepping Count
      description: Number of steps on dimming up the light(s).
      default: 30
      selector:
        number:
          min: 5
          max: 100
          step: 5
    stepping_time:
      name:  Stepping Time
      description: Time (in seconds) between the steps on dimming up the light(s).
      default: 60
      selector:
        number:
          min: 5
          max: 120
          step: 5
          unit_of_measurement: seconds

    action_start:
      name: (Optional) Actions On Start
      description: Additional action(s) to run, on starting.
      selector:
        action: {}
      default: []
    action_finish:
      name: (Optional) Actions When Finished
      description: Additional action(s) to run, when finished.
      selector:
        action: {}
      default: []

variables:
  # get the settings to variables
  persons: !input persons
  persons_home: >
    {% if persons is not none %}
      {{ expand(persons) | selectattr('state', 'in', ['home','on','active']) | list | count }}
    {% else %}
      -1
    {% endif %}
  lights: !input lights
  # supported_color_modes my be onoff, brightness, color_temp, xy, hs
  #lights_dim: "{{ expand(lights) }}"
  #lights_cct: "{{ expand(lights) }}"
  #lights_rgb: "{{ expand(lights) }}"
  #lights_cct: "{{ expand(lights) | selectattr('supported_color_modes', 'search', 'color_temp') }}"
  #lights_rgb: "{{ expand(lights) | selectattr('supported_color_modes', 'search', 'xy') | map(attribute='entity_id') | list }}"
  # {{ state_attr('light.dining_room', 'effect_list') | contains('rainbow') }}
  controlling_master: "{{ lights | list | first }}" # first light
  target_brightness: !input target_brightness
  target_kelvin: !input target_kelvin
  luxmeter: !input luxmeter
  # 'state' attribute is string, so max filter will sort on string basis
  luxmeter_value: >
    {% if luxmeter is not none %}
      {{ expand(luxmeter) | rejectattr('state', 'in', ['unavailable','undefined','unknown']) | map(attribute='state') | max }}
    {% else %}
      -1
    {% endif %}
  stepping_count: !input stepping_count
  stepping_time: !input stepping_time
  action_start: !input action_start
  action_finish: !input action_finish

  is_manual_event: "{{ trigger is not none and trigger.id == 'manual_event' }}"
  manual_event: >
    {% if trigger is not none and trigger.id == 'manual_event' and trigger.event.event_type is not none %}
      {{ trigger.event.event_type }}
    {% else %}
      none
    {% endif %}

trigger_variables:
  alarm: !input alarm
  prealarm_time: !input prealarm_time

trigger:
#  - id: "pre_alarm_time"
#    trigger: time
#    at:
#      entity_id: !input alarm
#      offset: !input prealarm_time
#  - id: "alarm_time"
#    trigger: time
#    at:
#      entity_id: !input alarm
  - id: "manual_event"
    alias: "manual WAKE_UP_LIGHT event"
    platform: event
    event_type:
      - "WAKE_UP_LIGHT"
  - id: "before_datetime"
    alias: "minutes before ALARM"
    platform: template
    value_template: |-
      {% if has_value(alarm) -%}
        {% set alarm_dt = states(alarm) | as_datetime | as_local %}
        {% set alarm_off = timedelta(minutes = prealarm_time|default(0)) %}
        {{ (now() > alarm_dt + alarm_off) }}
      {%- else -%}
        {{ false }}
      {%- endif %}


#conditions:
#  - condition: template
#    value_template: "{{ is_state(controlling_master,'off') }}"

mode: single

action:
  - choose:
    - conditions:
        - "{{ persons_home == 0 }}"
      sequence:
        - stop: "STOPP, if not at home."
    - conditions:
        - "{{ is_state(controlling_master,'on') }}"
      sequence:
        - stop: "STOPP, if light is already on."
    - conditions:
        - "{{ luxmeter_value > 250 }}"
      sequence:
        - stop: "STOPP, if illumination sufficient."
    - conditions: # dummy
        - "{{ action_start is not none }}"
      sequence:
        - alias: "Run the configured start action"
          choose: []
          default: !input action_start
  - variables: # lighting handling
      set_kelvin: "{{ state_attr(controlling_master, 'min_color_temp_kelvin') | default(2000) | int }}"
      step_kelvin: "{{ (target_kelvin - set_kelvin) / stepping_count | float }}"
      set_brightness: 1
      step_brightness: "{{ target_brightness / stepping_count | float }}"

  - repeat:
      count: "{{ stepping_count }}"
      sequence:
        - variables:
            off_kelvin: "{{ repeat.index | multiply(step_kelvin) | int }}"
            off_brightness: "{{ repeat.index | multiply(step_brightness) | int }}"
        - action: light.turn_on
          continue_on_error: true
          metadata: {}
          data:
            color_temp_kelvin: "{{ set_kelvin + off_kelvin }}"
            brightness: "{{ set_brightness + off_brightness }}"
          entity_id: !input lights
#        - delay: "{{ stepping_time }}"
        - alias: "Wait, if light is changed manually"
          wait_for_trigger:
            - id: 'lights_changed'
              trigger: state
              entity_id: !input lights
            - id: 'alarm_changed'
              trigger: state
              entity_id: !input alarm
          timeout: "{{ stepping_time }}"
          continue_on_timeout: true
        - if:
            - "{{ wait.trigger is not none }}"
            #- "{{ wait.trigger is not none and wait.trigger.id == 'lights_changed' }}"
            #- "{{ wait.trigger is not none and wait.trigger.id == 'alarm_changed' }}"
          then:
            - stop: "STOPP, if light or alarm being changed otherwise."

  - action: light.turn_on
    continue_on_error: true
    metadata: {}
    data:
      color_temp_kelvin: "{{ target_kelvin }}"
      brightness: "{{ target_brightness }}"
    entity_id: !input lights

  - choose:
    - conditions: # dummy
        - "{{ action_finish is not none }}"
      sequence:
        - alias: "Run the configured finished action"
          choose: []
          default: !input action_finish
